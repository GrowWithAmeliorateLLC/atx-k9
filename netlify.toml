# ATX K9 Dog Training — atxk9.com
# Static site. No build step; Netlify publishes the repo root.
[build]
  publish = "."

# Pretty URLs processing stays off. Since 11/19/26 every page lives at a clean
# folder URL (/private/ = private/index.html); old .html URLs 301 via _redirects.
[build.processing.html]
  pretty_urls = false
